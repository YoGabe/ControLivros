<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title> Controlivros - Sistema para controle de bibliotecas </title>
    <link rel="stylesheet" href="stilo.css">
</head>
<body>
    <div class="caixa-login">
        <h1> Entrar na sua livraria </h1>
        <form action="cadastroInt.html" method="post">
            <label for="usuario"> Insira suas credenciais </label>
            <input type="text" id="useuario" placeholder="seuemail@livraria.br" required><br><br>
            <label for="senha"> Senha de acesso </label>
            <input type="password" id="senha"placeholder="Digite sua senha" required> <br><br>
            <button type="button" class="btn-princ" id="btnConfirma"> Entrar </button> <br>
            <p> Não tem cadastro? <a href="cadastroInt.html" class="btn-sec">  Cadastre-se aqui</a></p>
        </form>
    </div>
    <div class="mensagem" id="Feedback"></div>
    <script src="funcioInt.js"> </script>
</body>
</html>
